<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Mengarahkan ke Email…</title>

  <!-- Penting untuk tampilan mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Redirect otomatis melalui Meta -->
  <meta http-equiv="refresh"
        content="0;url=mailto:admin@espeje.com?subject=Halo...%20saya%20ingin%20mencoba%20aplikasi%20trial%20nya&body=Halo...%20saya%20ingin%20mencoba%20aplikasi%20trial%20nya.%0A%0ANama%20%20%20%20%20%20%20:%20%0ANo.%20HP%20%20%20:%20%0AInstansi%20:%20%0AEmail%20%20%20%20:%20" />

  <!-- Redirect JavaScript sebagai backup -->
  <script>
    setTimeout(function () {
      window.location.href =
        "mailto:admin@espeje.com?subject=Halo...%20saya%20ingin%20mencoba%20aplikasi%20trial%20nya&body=Halo...%20saya%20ingin%20mencoba%20aplikasi%20trial%20nya.%0A%0ANama%20%20%20%20%20%20%20:%20%0ANo.%20HP%20%20%20:%20%0AInstansi%20:%20%0AEmail%20%20%20%20:%20";
    }, 500);
  </script>

  <style>
    :root {
      --bg: #f9fafb;
      --text: #111827;
      --muted: #6b7280;
      --button: #2563eb;
      --button-text: #ffffff;
      --card: #ffffff;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrapper {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 16px;
      padding: 24px 18px 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      border: 1px solid var(--border);
    }

    .title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--muted);
      margin: 0 0 18px;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      width: 100%;
      max-width: 320px;
      background: var(--button);
      color: var(--button-text);
      padding: 14px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin-top: 4px;
    }

    .button:active {
      transform: translateY(1px);
    }

    .manual-label {
      margin-top: 22px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    code {
      display: inline-block;
      margin-top: 8px;
      background: #f3f4f6;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.9rem;
    }

    .footnote {
      margin-top: 18px;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.4;
    }

    /* Sedikit tweak untuk layar sangat kecil */
    @media (max-width: 360px) {
      .wrapper {
        padding: 20px 14px 18px;
      }
      .title {
        font-size: 1.05rem;
      }
      .button {
        font-size: 0.95rem;
        padding: 12px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <p class="title">Mengarahkan ke aplikasi Email…</p>
    <p class="subtitle">
      Jika tidak otomatis terbuka dalam beberapa detik,<br />
      silakan ketuk tombol di bawah ini.
    </p>

    <a class="button"
       href="mailto:admin@espeje.com?subject=Halo...%20saya%20ingin%20mencoba%20aplikasi%20trial%20nya&body=Halo...%20saya%20ingin%20mencoba%20aplikasi%20trial%20nya.%0A%0ANama%20%20%20%20%20%20%20:%20%0ANo.%20HP%20%20%20:%20%0AInstansi%20:%20%0AEmail%20%20%20%20:%20">
      Kirim Email ke Admin
    </a>

    <p class="manual-label">Atau kirim email manual ke:</p>
    <code>admin@espeje.com</code>

    <p class="footnote">
      Halaman ini hanya membantu membuka aplikasi email Anda.<br />
      Tidak ada data yang disimpan di server.
    </p>
  </div>
</body>
</html>
